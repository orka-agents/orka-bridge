name: Windows native premises
on:
  push:
    branches: [ci/windows-boot-kit]
    paths:
      - 'runtime/windows/native-check/**'
      - '.github/workflows/windows-native-check.yml'
permissions:
  contents: read
  actions: read
# Do not cancel an owned native process halfway through its teardown.
concurrency:
  group: windows-native-check-${{ github.ref }}
  cancel-in-progress: false
env:
  GIT_CONFIG_COUNT: '3'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.symlinks
  GIT_CONFIG_VALUE_1: 'false'
  GIT_CONFIG_KEY_2: core.longpaths
  GIT_CONFIG_VALUE_2: 'true'
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: driver
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: boot-source
          ref: c3a2e920702b029472d1fb840a3cf21a1252cb6f
          persist-credentials: false
      - name: Initialize diagnostic directory and assert source identity
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'native-operator'
          New-Item -ItemType Directory -Path $output -ErrorAction Stop | Out-Null
          "NATIVE_OUTPUT=$output" >> $env:GITHUB_ENV
          $head = git -C boot-source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne 'c3a2e920702b029472d1fb840a3cf21a1252cb6f') { throw 'Wrong source head' }
          $dirty = git -C boot-source status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Source checkout is not clean' }
          git -C driver diff --exit-code 006b30f02a3c9cec61f8f3cc32fde6b0d248fc34 -- runtime/windows/recipe.py runtime/windows/verify.py runtime/windows/sources.lock.json runtime/windows/packages.lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Producer verifier or external locks changed' }
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.11'
      - name: Check archive and bundle tooling
        run: |
          python -m unittest discover -s driver/runtime/windows -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Producer tooling tests failed' }
          python -m unittest discover -s driver/runtime/windows/native-check -p 'test_bundle.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Native bundle tests failed' }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1-x86_64-pc-windows-msvc
      - name: Build the static-CRT standalone probe
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/native-target
          RUSTFLAGS: -Ctarget-feature=+crt-static
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          cargo +1.98.1-x86_64-pc-windows-msvc test --release --locked --manifest-path boot-source/runtime/Cargo.toml -p bridge-runtime-protocol --test windows_backend restricted_token_default_dacl_stays_user_and_system_only
          if ($LASTEXITCODE -ne 0) { throw 'Default DACL regression failed' }
          cargo +1.98.1-x86_64-pc-windows-msvc test --release --locked --manifest-path boot-source/runtime/Cargo.toml -p bridge-runtime-protocol --test windows_backend restricting_sids_are_exactly_user_system_and_restricted
          if ($LASTEXITCODE -ne 0) { throw 'Exact restricting SID regression failed' }
          $pipeTest = @(cargo +1.98.1-x86_64-pc-windows-msvc test --release --locked --manifest-path boot-source/runtime/Cargo.toml -p bridge-runtime-protocol --test windows_backend pipe_query_accepts_only_protected_user_system_dacl 2>&1)
          $pipeTest | ForEach-Object { Write-Output $_ }
          if ($LASTEXITCODE -ne 0 -or ($pipeTest -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed;') { throw 'Protected pipe query regression failed or matched no test' }
          cargo +1.98.1-x86_64-pc-windows-msvc build --release --locked --manifest-path driver/runtime/windows/native-check/probe/Cargo.toml 2>&1 | Tee-Object -FilePath (Join-Path $env:NATIVE_OUTPUT 'build.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native probe build failed' }
          $testBuild = @(cargo +1.98.1-x86_64-pc-windows-msvc test --release --no-run --message-format=json --locked --manifest-path driver/runtime/windows/native-check/probe/Cargo.toml 2>&1)
          $testExit = $LASTEXITCODE
          $testBuild | Set-Content -Encoding utf8 (Join-Path $env:NATIVE_OUTPUT 'guard-test-build.log')
          if ($testExit -ne 0) { throw 'Native helper test build failed' }
          $testExecutables = @($testBuild | ForEach-Object {
            try { $item = $_.ToString() | ConvertFrom-Json } catch { return }
            if ($item.reason -eq 'compiler-artifact' -and $item.profile.test -eq $true -and $item.target.name -eq 'bridge-native-premises' -and $item.executable) { $item.executable }
          } | Sort-Object -Unique)
          if ($testExecutables.Count -ne 1 -or -not (Test-Path -LiteralPath $testExecutables[0])) { throw 'Expected one actual helper test executable' }
          "NATIVE_GUARD_TEST_EXE=$($testExecutables[0])" >> $env:GITHUB_ENV
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release/bridge-native-premises.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Runner MSVC tools missing' }
          $dumpbin = Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe') | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'Runner dumpbin missing' }
          $deps = & $dumpbin.FullName /dependents $exe
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect probe PE dependencies' }
          $deps | Set-Content -Encoding utf8 (Join-Path $env:NATIVE_OUTPUT 'probe-dependents.txt')
          if (($deps -join "`n") -match '(?im)^\s*(?:vcruntime[^\s]*|msvcp[^\s]*|concrt[^\s]*|ucrtbase|api-ms-win-crt-[^\s]*)\.dll\s*$') { throw 'Probe still needs a dynamic VC runtime' }
          Get-FileHash -Algorithm SHA256 $exe | Format-List
      - name: Await only the existing main producer and download its artifact
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $producer = Join-Path $env:RUNNER_TEMP 'native-producer'
          New-Item -ItemType Directory -Path $producer -ErrorAction Stop | Out-Null
          gh run watch 42120608528 --repo orka-agents/orka-bridge --exit-status --interval 30 2>&1 | Tee-Object -FilePath (Join-Path $env:NATIVE_OUTPUT 'producer-watch.log')
          if ($LASTEXITCODE -ne 0) { throw 'Existing runtime producer did not succeed' }
          $raw = gh run view 42120608528 --repo orka-agents/orka-bridge --json databaseId,headSha,headBranch,event,workflowName,status,conclusion,url
          if ($LASTEXITCODE -ne 0) { throw 'Cannot authenticate producer identity' }
          $run = $raw | ConvertFrom-Json
          if ($run.databaseId -ne 42120608528 -or $run.headSha -ne '006b30f02a3c9cec61f8f3cc32fde6b0d248fc34' -or $run.headBranch -ne 'main' -or $run.event -ne 'workflow_dispatch' -or $run.workflowName -ne 'Windows runtime' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { throw 'Wrong producer identity or conclusion' }
          $raw | Set-Content -Encoding utf8 (Join-Path $producer 'producer-run.json')
          gh run download 42120608528 --repo orka-agents/orka-bridge --name bridge-windows-runtime-006b30f02a3c9cec61f8f3cc32fde6b0d248fc34-1 --dir $producer
          if ($LASTEXITCODE -ne 0) { throw 'Known producer artifact download failed; do not rebuild' }
      - name: Verify both archives, pin all runtime files and extract a fresh runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path ($env:SystemDrive + '\') ('bridge-native-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $stage -ErrorAction Stop | Out-Null
          "NATIVE_STAGE=$stage" >> $env:GITHUB_ENV
          $producer = Join-Path $env:RUNNER_TEMP 'native-producer'
          python driver/runtime/windows/native-check/bundle.py prepare --producer $producer --run-file (Join-Path $producer 'producer-run.json') --sources driver/runtime/windows/sources.lock.json --packages driver/runtime/windows/packages.lock.json --exe (Join-Path $env:RUNNER_TEMP 'native-target/release/bridge-native-premises.exe') --output $env:NATIVE_OUTPUT --runtime (Join-Path $stage 'runtime') --driver-head $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Independent producer verification or bundle assembly failed' }
          Copy-Item (Join-Path $env:NATIVE_OUTPUT 'bridge-native-premises.exe'), (Join-Path $env:NATIVE_OUTPUT 'runtime-pin.json') -Destination $stage
          Copy-Item -LiteralPath $env:NATIVE_GUARD_TEST_EXE -Destination (Join-Path $stage 'bridge-guard-tests.exe')
      - name: Exercise actual owned qemu-img and retained state identity
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path ($env:SystemDrive + '\') ('bs-' + $env:GITHUB_RUN_ID)
          & (Join-Path $env:NATIVE_STAGE 'bridge-native-premises.exe') state-check (Join-Path $env:NATIVE_STAGE 'runtime') (Join-Path $env:NATIVE_OUTPUT 'runtime-pin.json') $work 2>&1 | Tee-Object -FilePath (Join-Path $env:NATIVE_OUTPUT 'ci-state.log')
          $stateExit = $LASTEXITCODE
          if (Test-Path (Join-Path $work 'receipt.json')) { Copy-Item (Join-Path $work 'receipt.json') -Destination (Join-Path $env:NATIVE_OUTPUT 'ci-state-receipt.json') }
          if (Test-Path (Join-Path $work 'qemu-img-stderr.txt')) { Copy-Item (Join-Path $work 'qemu-img-stderr.txt') -Destination (Join-Path $env:NATIVE_OUTPUT 'ci-state-stderr.txt') }
          if ($stateExit -ne 0) { throw 'Actual owned qemu-img state preparation failed' }
      - name: Full four-case native qualification with required account challenge
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $process = $null; $client = $null
          $secure = $null; $otherSecure = $null
          $created = $false; $otherCreated = $false
          $name = 'bnc' + [guid]::NewGuid().ToString('N').Substring(0, 12)
          $otherName = 'bno' + [guid]::NewGuid().ToString('N').Substring(0, 12)
          $result = [ordered]@{ status = 'failed'; sourceHead = 'c3a2e920702b029472d1fb840a3cf21a1252cb6f'; fullFourCaseQualification = $true; controllerExitObserved = $false; accountRemoved = $false; otherAccountRemoved = $false; diagnosticLoaderTrace = $false }
          function Grant-Access([string]$Path, [string[]]$Rules) {
            & icacls.exe $Path /inheritance:r /grant:r @Rules | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Cannot stage required access rights' }
          }
          try {
            if (Test-Path -LiteralPath (Join-Path $env:NATIVE_STAGE 'loader-trace.enabled')) { throw 'No diagnostic debugger in AF_UNIX check' }
            $secure = ConvertTo-SecureString ('Aa1!' + [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(48))) -AsPlainText -Force
            $otherSecure = ConvertTo-SecureString ('Aa1!' + [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(48))) -AsPlainText -Force
            $user = New-LocalUser -Name $name -Password $secure -Description 'AF_UNIX owner check'; $created = $true
            $other = New-LocalUser -Name $otherName -Password $otherSecure -Description 'AF_UNIX negative control'; $otherCreated = $true
            $users = Get-LocalGroup -SID 'S-1-5-32-545'; $admins = Get-LocalGroup -SID 'S-1-5-32-544'
            Add-LocalGroupMember -Group $users -Member $user, $other
            if (Get-LocalGroupMember -Group $admins | Where-Object { $_.SID -eq $user.SID -or $_.SID -eq $other.SID }) { throw 'Both accounts must be standard users' }
            if ($user.SID.Value -eq $other.SID.Value) { throw 'Negative account must be distinct' }
            $result.accountSid = $user.SID.Value; $result.otherSid = $other.SID.Value
            Grant-Access $env:NATIVE_STAGE @('*S-1-5-18:(OI)(CI)(F)', '*S-1-5-32-544:(OI)(CI)(F)', '*S-1-5-32-545:(OI)(CI)(RX)')
            & icacls.exe $env:NATIVE_STAGE /grant:r ("*" + $user.SID.Value + ':(OI)(CI)(RX)') ("*" + $other.SID.Value + ':(OI)(CI)(RX)') /T | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Payload read rights could not be staged' }
            # Separate diagnostics export only; never widen private endpoints or inputs.
            $logs = Join-Path $env:NATIVE_STAGE 'logs'; New-Item -ItemType Directory -Path $logs -ErrorAction Stop | Out-Null
            Grant-Access $logs @('*S-1-5-18:(OI)(CI)(F)', '*S-1-5-32-544:(OI)(CI)(F)', ("*" + $user.SID.Value + ':(OI)(CI)(F)'))
            $parent = Join-Path $env:NATIVE_STAGE 'work'; New-Item -ItemType Directory -Path $parent -ErrorAction Stop | Out-Null
            Grant-Access $parent @('*S-1-5-18:(OI)(CI)(F)', '*S-1-5-32-544:(OI)(CI)(F)', ("*" + $user.SID.Value + ':(OI)(CI)(F)'))
            # This separate positive-control fixture deliberately admits the other account.
            # The private directory and target socket are NEVER widened or repaired.
            $controlDir = Join-Path $env:NATIVE_STAGE 'af-control'; New-Item -ItemType Directory -Path $controlDir -ErrorAction Stop | Out-Null
            Grant-Access $controlDir @('*S-1-5-18:(OI)(CI)(F)', '*S-1-5-32-544:(OI)(CI)(F)', ("*" + $user.SID.Value + ':(OI)(CI)(F)'), ("*" + $other.SID.Value + ':(OI)(CI)(F)'))
            $exe = Join-Path $env:NATIVE_STAGE 'bridge-native-premises.exe'
            $runtime = Join-Path $env:NATIVE_STAGE 'runtime'; $pin = Join-Path $env:NATIVE_STAGE 'runtime-pin.json'
            $credential = [PSCredential]::new(("$env:COMPUTERNAME\" + $name), $secure)
            $otherCredential = [PSCredential]::new(("$env:COMPUTERNAME\" + $otherName), $otherSecure)
            # Complete the second user's first profile logon BEFORE the owner's
            # fixed 30-second challenge window. This is not a connection proof.
            $warmupOut = Join-Path $env:NATIVE_OUTPUT 'ci-af-warmup.json'
            $client = Start-Process -FilePath $exe -ArgumentList ('unix-connect "{0}"' -f (Join-Path $controlDir 'absent.sock')) -Credential $otherCredential -LoadUserProfile -UseNewEnvironment -WorkingDirectory $env:NATIVE_STAGE -RedirectStandardOutput $warmupOut -RedirectStandardError (Join-Path $env:NATIVE_OUTPUT 'ci-af-client-stderr.txt') -PassThru
            [void]$client.Handle
            if (-not $client.WaitForExit(45000) -or $client.ExitCode -ne 0) { throw 'Other-account profile warmup failed' }
            $warmup = Get-Content -LiteralPath $warmupOut -Raw | ConvertFrom-Json -AsHashtable
            if ($warmup.sourceHead -ne 'c3a2e920702b029472d1fb840a3cf21a1252cb6f' -or $warmup.caller.userSid -ne $other.SID.Value -or $warmup.caller.elevated -ne $false) { throw 'Other-account warmup identity mismatch' }
            $client.Dispose(); $client = $null
            # Run only the three helper guard tests as the same unelevated owner.
            # The extra test executable is CI-only and is not an operator payload.
            $testExe = Join-Path $env:NATIVE_STAGE 'bridge-guard-tests.exe'
            $testOut = Join-Path $env:NATIVE_OUTPUT 'ci-guard-tests.txt'
            $client = Start-Process -FilePath $testExe -ArgumentList 'native::guard_case::tests --nocapture --test-threads=1' -Credential $credential -LoadUserProfile -UseNewEnvironment -WorkingDirectory $env:NATIVE_STAGE -RedirectStandardOutput $testOut -RedirectStandardError (Join-Path $env:NATIVE_OUTPUT 'ci-guard-tests-stderr.txt') -PassThru
            [void]$client.Handle
            if (-not $client.WaitForExit(45000) -or $client.ExitCode -ne 0) { throw 'Native helper guard tests failed or exceeded their bound' }
            $testText = Get-Content -LiteralPath $testOut -Raw
            if ($testText -notmatch 'test result: ok\. 3 passed; 0 failed;') { throw 'Native helper guard tests matched the wrong count' }
            $result.guardTestsPassed = $true
            $result.guardTestsSha256 = (Get-FileHash -LiteralPath $testExe -Algorithm SHA256).Hash.ToLowerInvariant()
            $client.Dispose(); $client = $null
            $arguments = 'check "{0}" "{1}" "{2}" --ci-access-proof' -f $runtime, $pin, (Join-Path $parent 'cases')
            $out = Join-Path $env:NATIVE_OUTPUT 'ci-stdout.txt'; $err = Join-Path $env:NATIVE_OUTPUT 'ci-stderr.txt'
            $process = Start-Process -FilePath $exe -ArgumentList $arguments -Credential $credential -LoadUserProfile -UseNewEnvironment -WorkingDirectory $env:NATIVE_STAGE -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
            [void]$process.Handle
            $until = [DateTime]::UtcNow.AddSeconds(90); $ready = $null
            while ($null -eq $ready) {
              if (Test-Path -LiteralPath $out) {
                foreach ($line in @(Get-Content -LiteralPath $out)) {
                  if ($line.StartsWith('{') -and $line.EndsWith('}')) {
                    try { $item = $line | ConvertFrom-Json -AsHashtable } catch { continue }
                    if ($item.stage -eq 'native-control-ready') { $ready = $item }
                  }
                }
              }
              if ($null -ne $ready) { break }
              if ($process.HasExited -or [DateTime]::UtcNow -ge $until) { throw 'AF_UNIX endpoint did not become ready; inspect actual startup/security diagnostics' }
              Start-Sleep -Milliseconds 20
            }
            if ($ready.sourceHead -ne 'c3a2e920702b029472d1fb840a3cf21a1252cb6f') { throw 'Wrong ready source' }
            $observations = @{}
            foreach ($case in @(@{ name='control'; path=$ready.control }, @{ name='private'; path=$ready.endpoint })) {
              $clientOut = Join-Path $env:NATIVE_OUTPUT ('ci-af-' + $case.name + '.json')
              $client = Start-Process -FilePath $exe -ArgumentList ('unix-connect "{0}"' -f $case.path) -Credential $otherCredential -LoadUserProfile -UseNewEnvironment -WorkingDirectory $env:NATIVE_STAGE -RedirectStandardOutput $clientOut -RedirectStandardError (Join-Path $env:NATIVE_OUTPUT 'ci-af-client-stderr.txt') -PassThru
              [void]$client.Handle
              if (-not $client.WaitForExit(45000)) { throw 'Owned negative-control client exceeded deadline' }
              if ($client.ExitCode -ne 0) { throw 'Other-account client failed before reporting its socket result' }
              $observation = Get-Content -LiteralPath $clientOut -Raw | ConvertFrom-Json -AsHashtable
              if ($observation.sourceHead -ne 'c3a2e920702b029472d1fb840a3cf21a1252cb6f' -or $observation.path -ne $case.path -or $observation.caller.userSid -ne $other.SID.Value -or $observation.caller.elevated -ne $false) { throw 'Other-account socket result identity mismatch' }
              $observations[$case.name] = $observation
              $client.Dispose(); $client = $null
            }
            $proof = [ordered]@{ sourceHead='c3a2e920702b029472d1fb840a3cf21a1252cb6f'; endpoint=$ready.endpoint; primarySid=$user.SID.Value; otherSid=$other.SID.Value; otherElevated=$observations.private.caller.elevated; controlConnected=$observations.control.result.connected; controlPeerPid=$observations.control.result.peerPid; privateConnected=$observations.private.result.connected; privateError=$observations.private.result.errorCode }
            $result.otherAccount = $proof
            # Stage is admin-owned and read-only to both accounts. Publish proof atomically.
            $proofPath = Join-Path $env:NATIVE_STAGE 'af-unix-proof.json'
            if (Test-Path -LiteralPath $proofPath) { throw 'Refusing pre-existing AF_UNIX proof' }
            $tmp = Join-Path $env:NATIVE_STAGE 'af-unix-proof.tmp'
            $proof | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 -LiteralPath $tmp
            Move-Item -LiteralPath $tmp -Destination $proofPath -ErrorAction Stop
            if (-not $process.WaitForExit(240000)) { throw 'Full four-case controller did not finish its bounded checks' }
            $result.controllerExitObserved = $true
            if ($process.ExitCode -ne 0) { throw 'Full native security, QMP or ownership case failed' }
            $lines = @(Get-Content -LiteralPath $out | Where-Object { $_.StartsWith('{') })
            if ($lines.Count -ne 2) { throw 'Expected ready and complete four-case receipt' }
            $receipt = $lines[-1] | ConvertFrom-Json -AsHashtable
            $trustedPin = Get-Content -LiteralPath $pin -Raw | ConvertFrom-Json -AsHashtable
            if ($receipt.status -ne 'passed' -or $receipt.sourceHead -ne 'c3a2e920702b029472d1fb840a3cf21a1252cb6f' -or $receipt.caller.userSid -ne $result.accountSid -or $receipt.caller.elevated -ne $false -or $receipt.probeSha256 -ne (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -or $receipt.producerRun -ne 42120608528 -or $receipt.runtimeZipSha256 -ne $trustedPin.runtimeZipSha256) { throw 'Receipt binding mismatch' }
            if ($receipt.cases.Count -ne 4 -or (@($receipt.cases.case) -join ',') -ne 'smoke,hold-created,hold-pipe,hold-guard-only') { throw 'All four unchanged premises cases are required' }
            $smoke = $receipt.cases[0].result
            if ($smoke.smoke -ne 'passed' -or $smoke.qmp.replies[1].return.status -ne 'prelaunch' -or $smoke.qmp.replies[1].return.running -ne $false -or $smoke.qmp.replies[2].id -ne 3 -or $smoke.qmp.quitExitObserved -ne $true -or $smoke.qmp.exitCode -ne 0 -or $smoke.terminalDisconnect.exitObserved -ne $true -or $smoke.terminalDisconnect.exitCode -ne 1 -or $smoke.otherAccount.privateError -ne 10013 -or $smoke.otherAccount.controlConnected -ne $true) { throw 'Exact QMP, quit, disconnect and account proof required' }
            foreach ($mapping in @(@{src=$smoke.qmp.rx;name='ci-qmp-rx.jsonl'}, @{src=$smoke.qmp.tx;name='ci-qmp-tx.jsonl'}, @{src=$smoke.terminalDisconnect.rx;name='ci-qmp-disconnect-rx.jsonl'}, @{src=$smoke.terminalDisconnect.tx;name='ci-qmp-disconnect-tx.jsonl'})) { Copy-Item -LiteralPath $mapping.src -Destination (Join-Path $env:NATIVE_OUTPUT $mapping.name) -ErrorAction Stop }
            $smoke | ConvertTo-Json -Depth 16 | Set-Content -Encoding utf8 (Join-Path $env:NATIVE_OUTPUT 'ci-qmp-summary.json')
            $result.status = 'passed'; $result.receipt = $receipt
          } catch { $result.error = $_.Exception.Message } finally {
            foreach ($owned in @($client, $process)) {
              if ($null -ne $owned) {
                try { if (-not $owned.HasExited) { $owned.Kill() }; if (-not $owned.WaitForExit(45000)) { throw 'Owned process exit unobserved' } } catch { $result.status='failed'; $result.cleanupError=$_.Exception.Message } finally { $owned.Dispose() }
              }
            }
            foreach ($mapping in @(@{src='qmp-rx.jsonl';name='ci-qmp-rx.jsonl'}, @{src='qmp-tx.jsonl';name='ci-qmp-tx.jsonl'}, @{src='qmp-disconnect-rx.jsonl';name='ci-qmp-disconnect-rx.jsonl'}, @{src='qmp-disconnect-tx.jsonl';name='ci-qmp-disconnect-tx.jsonl'})) { $p=Join-Path (Join-Path $env:NATIVE_STAGE 'logs') $mapping.src; if (Test-Path -LiteralPath $p) { Copy-Item -LiteralPath $p -Destination (Join-Path $env:NATIVE_OUTPUT $mapping.name) -Force } }
            if ($created) { try { Remove-LocalUser -Name $name; $result.accountRemoved=$true } catch { $result.status='failed'; $result.cleanupError=$_.Exception.Message } }
            if ($otherCreated) { try { Remove-LocalUser -Name $otherName; $result.otherAccountRemoved=$true } catch { $result.status='failed'; $result.cleanupError=$_.Exception.Message } }
            if ($null -ne $secure) { $secure.Dispose() }; if ($null -ne $otherSecure) { $otherSecure.Dispose() }
            $result | ConvertTo-Json -Depth 16 | Set-Content -Encoding utf8 (Join-Path $env:NATIVE_OUTPUT 'ci-controller.json')
            foreach ($file in 'ci-stdout.txt','ci-stderr.txt','ci-controller.json','ci-af-control.json','ci-af-private.json','ci-af-client-stderr.txt') { $p=Join-Path $env:NATIVE_OUTPUT $file; if (Test-Path -LiteralPath $p) { Get-Content -LiteralPath $p } }
          }
          if ($result.status -ne 'passed') { throw 'Complete four-case native qualification did not pass; retain the failed evidence' }

      - name: Hash only actual operator files, including failure diagnostics
        if: always()
        run: |
          python driver/runtime/windows/native-check/bundle.py finish --output (Join-Path $env:RUNNER_TEMP 'native-operator')
          if ($LASTEXITCODE -ne 0) { throw 'Operator checksum generation failed' }
      - name: Retain the bounded operator bundle and measured diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-windows-native-check-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-operator/bridge-windows-runtime-portable.zip
            ${{ runner.temp }}/native-operator/bridge-windows-runtime-source.zip
            ${{ runner.temp }}/native-operator/SHA256SUMS
            ${{ runner.temp }}/native-operator/build-report.json
            ${{ runner.temp }}/native-operator/verification.json
            ${{ runner.temp }}/native-operator/bridge-native-premises.exe
            ${{ runner.temp }}/native-operator/ci-state.log
            ${{ runner.temp }}/native-operator/ci-state-receipt.json
            ${{ runner.temp }}/native-operator/ci-state-stderr.txt
            ${{ runner.temp }}/native-operator/runtime-pin.json
            ${{ runner.temp }}/native-operator/producer-run.json
            ${{ runner.temp }}/native-operator/bundle-provenance.json
            ${{ runner.temp }}/native-operator/independent-verification.json
            ${{ runner.temp }}/native-operator/build.log
            ${{ runner.temp }}/native-operator/guard-test-build.log
            ${{ runner.temp }}/native-operator/ci-guard-tests.txt
            ${{ runner.temp }}/native-operator/ci-guard-tests-stderr.txt
            ${{ runner.temp }}/native-operator/probe-dependents.txt
            ${{ runner.temp }}/native-operator/producer-watch.log
            ${{ runner.temp }}/native-operator/ci-stdout.txt
            ${{ runner.temp }}/native-operator/ci-stderr.txt
            ${{ runner.temp }}/native-operator/ci-controller.json
            ${{ runner.temp }}/native-operator/ci-owned-pipe-stdout.txt
            ${{ runner.temp }}/native-operator/ci-owned-pipe-stderr.txt
            ${{ runner.temp }}/native-operator/ci-af-warmup.json
            ${{ runner.temp }}/native-operator/ci-af-control.json
            ${{ runner.temp }}/native-operator/ci-af-private.json
            ${{ runner.temp }}/native-operator/ci-af-client-stderr.txt
            ${{ runner.temp }}/native-operator/ci-qmp-rx.jsonl
            ${{ runner.temp }}/native-operator/ci-qmp-tx.jsonl
            ${{ runner.temp }}/native-operator/ci-qmp-disconnect-rx.jsonl
            ${{ runner.temp }}/native-operator/ci-qmp-disconnect-tx.jsonl
            ${{ runner.temp }}/native-operator/ci-qmp-summary.json
            ${{ runner.temp }}/native-operator/operator-sha256sums.txt
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
