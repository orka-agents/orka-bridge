name: Windows Job member diagnostic
on:
  push:
    branches: [ci/windows-native-check]
    paths:
      - 'runtime/windows/native-check/**'
      - '.github/workflows/windows-native-check.yml'
permissions:
  contents: read
  actions: read
# Do not cancel an owned native process halfway through its teardown.
concurrency:
  group: windows-native-check-${{ github.ref }}
  cancel-in-progress: false
env:
  GIT_CONFIG_COUNT: '3'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.symlinks
  GIT_CONFIG_VALUE_1: 'false'
  GIT_CONFIG_KEY_2: core.longpaths
  GIT_CONFIG_VALUE_2: 'true'
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: driver
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: native-source
          ref: 443bcc0718a777e03057c20ddc1a8dff12b159bf
          persist-credentials: false
      - name: Initialize diagnostic directory and assert source identity
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'native-operator'
          New-Item -ItemType Directory -Path $output -ErrorAction Stop | Out-Null
          "NATIVE_OUTPUT=$output" >> $env:GITHUB_ENV
          $head = git -C native-source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne '443bcc0718a777e03057c20ddc1a8dff12b159bf') { throw 'Wrong source head' }
          $dirty = git -C native-source status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Source checkout is not clean' }
          git -C driver diff --exit-code 006b30f02a3c9cec61f8f3cc32fde6b0d248fc34 -- runtime/windows/recipe.py runtime/windows/verify.py runtime/windows/sources.lock.json runtime/windows/packages.lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Producer verifier or external locks changed' }
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.11'
      - name: Check archive and bundle tooling
        run: |
          python -m unittest discover -s driver/runtime/windows -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Producer tooling tests failed' }
          python -m unittest discover -s driver/runtime/windows/native-check -p 'test_bundle.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Native bundle tests failed' }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1-x86_64-pc-windows-msvc
      - name: Build the static-CRT standalone probe
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/native-target
          RUSTFLAGS: -Ctarget-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Stop'
          cargo +1.98.1-x86_64-pc-windows-msvc test --release --locked --manifest-path native-source/runtime/Cargo.toml -p bridge-runtime-protocol --test windows_backend restricted_token_default_dacl_stays_user_and_system_only
          if ($LASTEXITCODE -ne 0) { throw 'Default DACL regression failed' }
          cargo +1.98.1-x86_64-pc-windows-msvc test --release --locked --manifest-path native-source/runtime/Cargo.toml -p bridge-runtime-protocol --test windows_backend restricting_sids_are_exactly_user_system_and_restricted
          if ($LASTEXITCODE -ne 0) { throw 'Exact restricting SID regression failed' }
          $pipeTest = @(cargo +1.98.1-x86_64-pc-windows-msvc test --release --locked --manifest-path native-source/runtime/Cargo.toml -p bridge-runtime-protocol --test windows_backend pipe_query_accepts_only_protected_user_system_dacl 2>&1)
          $pipeTest | ForEach-Object { Write-Output $_ }
          if ($LASTEXITCODE -ne 0 -or ($pipeTest -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed;') { throw 'Protected pipe query regression failed or matched no test' }
          cargo +1.98.1-x86_64-pc-windows-msvc build --release --locked --features member-diagnostic --manifest-path driver/runtime/windows/native-check/probe/Cargo.toml 2>&1 | Tee-Object -FilePath (Join-Path $env:NATIVE_OUTPUT 'build.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native probe build failed' }
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release/bridge-native-premises.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Runner MSVC tools missing' }
          $dumpbin = Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe') | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'Runner dumpbin missing' }
          $deps = & $dumpbin.FullName /dependents $exe
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect probe PE dependencies' }
          $deps | Set-Content -Encoding utf8 (Join-Path $env:NATIVE_OUTPUT 'probe-dependents.txt')
          if (($deps -join "`n") -match '(?im)^\s*(?:vcruntime[^\s]*|msvcp[^\s]*|concrt[^\s]*|ucrtbase|api-ms-win-crt-[^\s]*)\.dll\s*$') { throw 'Probe still needs a dynamic VC runtime' }
          Get-FileHash -Algorithm SHA256 $exe | Format-List
      - name: Await only the existing main producer and download its artifact
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $producer = Join-Path $env:RUNNER_TEMP 'native-producer'
          New-Item -ItemType Directory -Path $producer -ErrorAction Stop | Out-Null
          gh run watch 42120608528 --repo orka-agents/orka-bridge --exit-status --interval 30 2>&1 | Tee-Object -FilePath (Join-Path $env:NATIVE_OUTPUT 'producer-watch.log')
          if ($LASTEXITCODE -ne 0) { throw 'Existing runtime producer did not succeed' }
          $raw = gh run view 42120608528 --repo orka-agents/orka-bridge --json databaseId,headSha,headBranch,event,workflowName,status,conclusion,url
          if ($LASTEXITCODE -ne 0) { throw 'Cannot authenticate producer identity' }
          $run = $raw | ConvertFrom-Json
          if ($run.databaseId -ne 42120608528 -or $run.headSha -ne '006b30f02a3c9cec61f8f3cc32fde6b0d248fc34' -or $run.headBranch -ne 'main' -or $run.event -ne 'workflow_dispatch' -or $run.workflowName -ne 'Windows runtime' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { throw 'Wrong producer identity or conclusion' }
          $raw | Set-Content -Encoding utf8 (Join-Path $producer 'producer-run.json')
          gh run download 42120608528 --repo orka-agents/orka-bridge --name bridge-windows-runtime-006b30f02a3c9cec61f8f3cc32fde6b0d248fc34-1 --dir $producer
          if ($LASTEXITCODE -ne 0) { throw 'Known producer artifact download failed; do not rebuild' }
      - name: Verify both archives, pin all runtime files and extract a fresh runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path ($env:SystemDrive + '\') ('bridge-native-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $stage -ErrorAction Stop | Out-Null
          "NATIVE_STAGE=$stage" >> $env:GITHUB_ENV
          $producer = Join-Path $env:RUNNER_TEMP 'native-producer'
          python driver/runtime/windows/native-check/bundle.py prepare --producer $producer --run-file (Join-Path $producer 'producer-run.json') --sources driver/runtime/windows/sources.lock.json --packages driver/runtime/windows/packages.lock.json --exe (Join-Path $env:RUNNER_TEMP 'native-target/release/bridge-native-premises.exe') --output $env:NATIVE_OUTPUT --runtime (Join-Path $stage 'runtime') --driver-head $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Independent producer verification or bundle assembly failed' }
          Copy-Item (Join-Path $env:NATIVE_OUTPUT 'bridge-native-premises.exe'), (Join-Path $env:NATIVE_OUTPUT 'runtime-pin.json') -Destination $stage
      - name: One bounded Job member diagnostic, not native qualification
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $process = $null; $secure = $null; $created = $false
          $name = 'bnd' + [guid]::NewGuid().ToString('N').Substring(0, 12)
          $result = [ordered]@{ status='failed'; sourceHead='443bcc0718a777e03057c20ddc1a8dff12b159bf'; diagnosticOnly=$true; fullFourCaseQualification=$false; fullContainmentQualified=$false; controllerExitObserved=$false; accountRemoved=$false }
          function Grant-Access([string]$Path, [string[]]$Rules) {
            & icacls.exe $Path /inheritance:r /grant:r @Rules | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Cannot stage required access rights' }
          }
          try {
            if (Test-Path -LiteralPath (Join-Path $env:NATIVE_STAGE 'loader-trace.enabled')) { throw 'No debugger in member diagnostic' }
            $secure = ConvertTo-SecureString ('Aa1!' + [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(48))) -AsPlainText -Force
            $user = New-LocalUser -Name $name -Password $secure -Description 'Read-only Job member diagnostic'; $created = $true
            $users = Get-LocalGroup -SID 'S-1-5-32-545'; $admins = Get-LocalGroup -SID 'S-1-5-32-544'
            Add-LocalGroupMember -Group $users -Member $user
            if (Get-LocalGroupMember -Group $admins | Where-Object { $_.SID -eq $user.SID }) { throw 'Diagnostic caller must be a standard user' }
            $result.accountSid = $user.SID.Value
            Grant-Access $env:NATIVE_STAGE @('*S-1-5-18:(OI)(CI)(F)', '*S-1-5-32-544:(OI)(CI)(F)', '*S-1-5-32-545:(OI)(CI)(RX)')
            & icacls.exe $env:NATIVE_STAGE /grant:r ("*" + $user.SID.Value + ':(OI)(CI)(RX)') /T | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Payload read rights could not be staged' }
            foreach ($leaf in 'logs','work') {
              $dir = Join-Path $env:NATIVE_STAGE $leaf
              New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
              Grant-Access $dir @('*S-1-5-18:(OI)(CI)(F)', '*S-1-5-32-544:(OI)(CI)(F)', ("*" + $user.SID.Value + ':(OI)(CI)(F)'))
            }
            $provenancePath = Join-Path $env:NATIVE_OUTPUT 'bundle-provenance.json'
            $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json -AsHashtable
            $provenance.diagnosticOnly = $true
            $provenance.diagnosticImports = $true
            $provenance.fullContainmentQualified = $false
            $provenance.qualification = 'Modified diagnostic Job import; not a four-case containment or operator qualification'
            $provenance | ConvertTo-Json -Depth 16 | Set-Content -Encoding utf8 -LiteralPath $provenancePath
            $exe = Join-Path $env:NATIVE_STAGE 'bridge-native-premises.exe'
            $runtime = Join-Path $env:NATIVE_STAGE 'runtime'; $pin = Join-Path $env:NATIVE_STAGE 'runtime-pin.json'
            $credential = [PSCredential]::new(("$env:COMPUTERNAME\" + $name), $secure)
            $arguments = 'check "{0}" "{1}" "{2}" --job-member-diagnostic' -f $runtime, $pin, (Join-Path $env:NATIVE_STAGE 'work/cases')
            $out = Join-Path $env:NATIVE_OUTPUT 'ci-stdout.txt'; $err = Join-Path $env:NATIVE_OUTPUT 'ci-stderr.txt'
            $process = Start-Process -FilePath $exe -ArgumentList $arguments -Credential $credential -LoadUserProfile -UseNewEnvironment -WorkingDirectory $env:NATIVE_STAGE -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
            [void]$process.Handle
            if (-not $process.WaitForExit(180000)) { throw 'Single diagnostic exceeded bounded controller window' }
            $result.controllerExitObserved = $true
            if ($process.ExitCode -ne 0) { throw 'Diagnostic failed; preserve evidence, do not repeat automatically' }
            $lines = @(Get-Content -LiteralPath $out | Where-Object { $_.StartsWith('{') -and $_.EndsWith('}') })
            if ($lines.Count -lt 1) { throw 'Missing diagnostic receipt' }
            $receipt = $lines[-1] | ConvertFrom-Json -AsHashtable
            $trustedPin = Get-Content -LiteralPath $pin -Raw | ConvertFrom-Json -AsHashtable
            if ($receipt.status -ne 'job-member-diagnostic-only' -or $receipt.diagnosticComplete -ne $true -or $receipt.imports.diagnosticImports -ne $true -or $receipt.imports.derivedNotProduct -ne $true -or $receipt.imports.jobSourceSha256 -notmatch '^[0-9a-f]{64}$' -or $receipt.imports.jobImportSha256 -notmatch '^[0-9a-f]{64}$' -or $receipt.imports.jobSourceSha256 -eq $receipt.imports.jobImportSha256 -or $receipt.runtimeZipSha256 -ne $trustedPin.runtimeZipSha256 -or $receipt.sourceHead -ne '443bcc0718a777e03057c20ddc1a8dff12b159bf' -or $receipt.diagnosticOnly -ne $true -or $receipt.fullContainmentQualified -ne $false -or $receipt.caller.userSid -ne $result.accountSid -or $receipt.caller.elevated -ne $false -or $receipt.probeSha256 -ne (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -or $receipt.producerRun -ne 42120608528) { throw 'Diagnostic receipt binding mismatch' }
            $result.receipt = $receipt
            $result.status = 'diagnostic-only'
          } catch { $result.error = $_.Exception.Message } finally {
            if ($null -ne $process) {
              try { if (-not $process.HasExited) { $process.Kill() }; if (-not $process.WaitForExit(45000)) { throw 'Owned controller exit unobserved' } } catch { $result.status='failed'; $result.cleanupError=$_.Exception.Message } finally { $process.Dispose() }
            }
            foreach ($mapping in @(@{src='job-member-diagnostic-qmp-rx.jsonl';name='ci-qmp-rx.jsonl'}, @{src='job-member-diagnostic-qmp-tx.jsonl';name='ci-qmp-tx.jsonl'}, @{src='job-member-diagnostic-receipt.json';name='ci-job-member-diagnostic.json'})) {
              $p = Join-Path (Join-Path $env:NATIVE_STAGE 'logs') $mapping.src
              if (Test-Path -LiteralPath $p) { Copy-Item -LiteralPath $p -Destination (Join-Path $env:NATIVE_OUTPUT $mapping.name) -Force }
            }
            if ($created) { try { Remove-LocalUser -Name $name; $result.accountRemoved=$true } catch { $result.status='failed'; $result.cleanupError=$_.Exception.Message } }
            if ($null -ne $secure) { $secure.Dispose() }
            $result | ConvertTo-Json -Depth 24 | Set-Content -Encoding utf8 (Join-Path $env:NATIVE_OUTPUT 'ci-controller.json')
            foreach ($file in 'ci-stdout.txt','ci-stderr.txt','ci-controller.json') { $p=Join-Path $env:NATIVE_OUTPUT $file; if (Test-Path -LiteralPath $p) { Get-Content -LiteralPath $p } }
          }
          if ($result.status -ne 'diagnostic-only') { throw 'Bounded diagnostic incomplete; do not infer qualification or repeat automatically' }

      - name: Hash only actual operator files, including failure diagnostics
        if: always()
        run: |
          python driver/runtime/windows/native-check/bundle.py finish --output (Join-Path $env:RUNNER_TEMP 'native-operator')
          if ($LASTEXITCODE -ne 0) { throw 'Operator checksum generation failed' }
      - name: Retain the bounded operator bundle and measured diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-windows-native-check-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-operator/bridge-windows-runtime-portable.zip
            ${{ runner.temp }}/native-operator/bridge-windows-runtime-source.zip
            ${{ runner.temp }}/native-operator/SHA256SUMS
            ${{ runner.temp }}/native-operator/build-report.json
            ${{ runner.temp }}/native-operator/verification.json
            ${{ runner.temp }}/native-operator/bridge-native-premises.exe
            ${{ runner.temp }}/native-operator/runtime-pin.json
            ${{ runner.temp }}/native-operator/producer-run.json
            ${{ runner.temp }}/native-operator/bundle-provenance.json
            ${{ runner.temp }}/native-operator/independent-verification.json
            ${{ runner.temp }}/native-operator/build.log
            ${{ runner.temp }}/native-operator/probe-dependents.txt
            ${{ runner.temp }}/native-operator/producer-watch.log
            ${{ runner.temp }}/native-operator/ci-stdout.txt
            ${{ runner.temp }}/native-operator/ci-stderr.txt
            ${{ runner.temp }}/native-operator/ci-controller.json
            ${{ runner.temp }}/native-operator/ci-owned-pipe-stdout.txt
            ${{ runner.temp }}/native-operator/ci-owned-pipe-stderr.txt
            ${{ runner.temp }}/native-operator/ci-af-warmup.json
            ${{ runner.temp }}/native-operator/ci-af-control.json
            ${{ runner.temp }}/native-operator/ci-af-private.json
            ${{ runner.temp }}/native-operator/ci-af-client-stderr.txt
            ${{ runner.temp }}/native-operator/ci-qmp-rx.jsonl
            ${{ runner.temp }}/native-operator/ci-qmp-tx.jsonl
            ${{ runner.temp }}/native-operator/ci-qmp-disconnect-rx.jsonl
            ${{ runner.temp }}/native-operator/ci-qmp-disconnect-tx.jsonl
            ${{ runner.temp }}/native-operator/ci-qmp-summary.json
            ${{ runner.temp }}/native-operator/ci-job-member-diagnostic.json
            ${{ runner.temp }}/native-operator/operator-sha256sums.txt
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
