# Temporary branch-only diagnostic; restore App checks after the experiment.
name: Windows startup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  startup:
    if: github.ref == 'refs/heads/diagnose-windows-startup'
    runs-on: windows-2022
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bridge-windows-x64
          run-id: 43612580459
          github-token: ${{ github.token }}
          path: executable
      - name: Record source and validate PowerShell
        shell: pwsh
        run: |
          New-Item -ItemType Directory startup-evidence | Out-Null
          git rev-parse HEAD | Set-Content startup-evidence/diagnostic-head.txt
          '53ac63eed4bb1d13954c0abc6b1d5b9de3c8b078' | Set-Content startup-evidence/executable-head.txt
          Get-FileHash executable/development/orka-bridge.exe | Format-List | Out-File startup-evidence/executable-hash.txt
          $tokens = $null; $errors = $null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/diagnose-windows-startup.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Up to ten startups, stop on first stall
        shell: pwsh
        run: ./scripts/diagnose-windows-startup.ps1 -Executable executable/development/orka-bridge.exe -Output startup-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-startup-${{ matrix.runner }}
          path: startup-evidence/
          retention-days: 3
          if-no-files-found: error
