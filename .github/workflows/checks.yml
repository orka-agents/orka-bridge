name: App
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  failed-context:
    if: github.ref == 'refs/heads/check-failed-context'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build unchanged release frontend
        shell: bash
        run: |
          npm install --global npm@11.17.0 --ignore-scripts
          cd app
          npm ci
          npm run build
      - name: Fetch exact release-source native executable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/orka-agents/orka-bridge/actions/runs/43764407961 --jq .head_sha > native-source.txt
          test "$(tr -d '\r\n' < native-source.txt)" = 4bfa919f3510e6d61aae93d83cd75e2b5deeee9a
          gh api repos/orka-agents/orka-bridge/actions/artifacts/14182112178/zip > native.zip
          unzip -q native.zip -d native
          git diff --exit-code 4bfa919f3510e6d61aae93d83cd75e2b5deeee9a -- app
      - name: Native failed-context check with synthetic local operations
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:KUBECONFIG = Join-Path $env:RUNNER_TEMP 'unreachable-kubeconfig.json'
          '{"apiVersion":"v1","kind":"Config","current-context":"unreachable-loopback","clusters":[{"name":"nowhere","cluster":{"server":"http://127.0.0.1:9"}}],"contexts":[{"name":"unreachable-loopback","context":{"cluster":"nowhere","user":"empty"}}],"users":[{"name":"empty","user":{}}]}' | Set-Content -Encoding utf8NoBOM $env:KUBECONFIG
          $env:BRIDGE_DEV_IMAGE_DIR = Join-Path $env:RUNNER_TEMP 'empty-image'
          New-Item -ItemType Directory $env:BRIDGE_DEV_IMAGE_DIR | Out-Null
          New-Item -ItemType Directory evidence | Out-Null
          Copy-Item native-source.txt evidence/
          Get-FileHash native/development/orka-bridge.exe | Format-List | Out-File evidence/executable-hash.txt
          node scripts/check-failed-context.mjs native/development/orka-bridge.exe evidence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: failed-context-evidence
          path: evidence/
          retention-days: 3
          if-no-files-found: warn
