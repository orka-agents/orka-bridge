name: App

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm install --global npm@11.17.0 --ignore-scripts
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm install --global npm@11.17.0 --ignore-scripts
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: app-${{ matrix.os }}-rust-1.98.1-${{ hashFiles('app/src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: npm run build
      - name: Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --release --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol
          cargo clippy --release --manifest-path src-tauri/Cargo.toml --locked --all-targets --features custom-protocol -- -D warnings
      - name: Windows executable
        if: runner.os == 'Windows'
        run: |
          npm run tauri -- build --no-bundle -- --locked
          mkdir -p windows-artifact/licenses
          cp src-tauri/target/release/orka-bridge.exe windows-artifact/
          cp public/licenses/*.txt windows-artifact/licenses/
          for notice in public/licenses/*.txt; do cmp "$notice" "windows-artifact/licenses/${notice##*/}"; done
      - name: Mac app bundle and native walk
        if: runner.os == 'macOS'
        run: |
          npm run tauri -- build --bundles app --no-sign --no-binary-patching -- --locked
          bundle=src-tauri/target/release/bundle/macos/Bridge.app
          mkdir -p "$bundle/Contents/Resources/licenses"
          cp public/licenses/*.txt "$bundle/Contents/Resources/licenses/"
          test "$(lipo -archs "$bundle/Contents/MacOS/orka-bridge")" = arm64
          codesign --verify --ignore-resources "$bundle/Contents/MacOS/orka-bridge"
          tar -czf bridge-macos-arm64.tar.gz -C src-tauri/target/release/bundle/macos Bridge.app
          mkdir smoke-app
          tar -xzf bridge-macos-arm64.tar.gz -C smoke-app
          test -x smoke-app/Bridge.app/Contents/MacOS/orka-bridge
          cmp "$bundle/Contents/MacOS/orka-bridge" smoke-app/Bridge.app/Contents/MacOS/orka-bridge
          for notice in public/licenses/*.txt; do cmp "$notice" "smoke-app/Bridge.app/Contents/Resources/licenses/${notice##*/}"; done
          swift ../scripts/native-smoke.swift native-walk "$PWD/smoke-app/Bridge.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: bridge-${{ matrix.artifact }}
          path: app/windows-artifact/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'macOS'
        with:
          name: bridge-${{ matrix.artifact }}
          path: |
            app/bridge-macos-arm64.tar.gz
            app/native-walk/
          retention-days: 3
          if-no-files-found: error

  gate:
    name: App gate
    needs: [frontend, native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done
