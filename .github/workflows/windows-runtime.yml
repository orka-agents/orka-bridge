name: Windows runtime inputs
on:
  pull_request:
    paths:
      - 'runtime/windows/**'
      - '.github/workflows/windows-runtime.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'runtime/windows/**'
      - '.github/workflows/windows-runtime.yml'
permissions:
  contents: read
concurrency:
  group: windows-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sources:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s runtime/windows -p test_recipe.py -v
      - run: python runtime/windows/recipe.py check-sources --lock runtime/windows/sources.lock.json
