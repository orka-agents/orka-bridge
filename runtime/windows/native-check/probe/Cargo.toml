[package]
name = "bridge-native-premises"
version = "0.0.0"
edition = "2021"
[workspace]
[profile.release]
panic = "abort"
[dependencies]
bridge-runtime-protocol = { path = "../../../../../native-source/runtime/protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ProcessSnapshotting", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_Memory"] }
