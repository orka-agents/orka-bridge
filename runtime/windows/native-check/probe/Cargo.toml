[package]
name = "bridge-native-premises"
version = "0.0.0"
edition = "2021"
[workspace]
[profile.release]
panic = "abort"
[dev-dependencies]
tempfile = "=3.27.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
[dependencies]
bridge-runtime-protocol = { path = "../../../../../boot-source/runtime/protocol" }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
libc = "=0.2.191"
flate2 = "=1.1.10"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
semver = "=1.0.28"
tokio = { version = "=1.54.1", features = ["sync", "rt", "time", "process", "io-util", "macros", "fs", "net"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ProcessSnapshotting", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Console", "Win32_UI_Shell", "Win32_System_Com", "Wdk_System_SystemServices", "Win32_System_WindowsProgramming", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_Memory"] }
