[package]
name = "bridge-runtime-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.0", features = ["serde", "v4"] }
base64 = "=0.23.1"
sha2 = "=0.10.9"

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "stream"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
libc = "=0.2.191"
semver = "=1.0.28"
tokio = { version = "=1.54.1", features = ["process", "io-util", "sync", "rt", "macros", "time", "net"] }
tempfile = "=3.27.0"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Threading"] }
