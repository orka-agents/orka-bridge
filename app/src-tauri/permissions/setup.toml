[[permission]]
identifier = "setup"
description = "Reads workspace state and build requirements, selects the local VM, edits the owned agent file, runs its checks, explicitly connects its model, rereads cluster configuration, discovers and confirms access to existing clusters, and sends the owned agent file there to run its checks."
commands.allow = ["setup_status", "workspace_catalog", "setup_select_local", "setup_cancel_local", "setup_change_local", "setup_open_help", "setup_example", "setup_requirements", "setup_preflight", "setup_connect_model", "agent_run_status", "agent_run", "agents_list", "agent_selected", "agent_open", "agent_save", "cluster_contexts", "cluster_reload", "cluster_discover", "cluster_use", "send_preflight", "send_start", "send_status", "send_history", "send_stop"]
