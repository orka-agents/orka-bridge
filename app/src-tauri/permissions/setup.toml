[[permission]]
identifier = "setup"
description = "Reads workspace state and build requirements, selects the local VM, edits the owned agent file, runs its checks, chats with the saved agent on the local workspace, explicitly connects its model or removes its saved sign-in, rereads cluster configuration, discovers and confirms access to existing clusters, and sends the owned agent file there to run its checks."
commands.allow = ["setup_status", "workspace_catalog", "setup_select_local", "setup_cancel_local", "setup_change_local", "setup_open_help", "setup_example", "setup_requirements", "setup_preflight", "setup_connect_model", "setup_remove_model", "agent_run_status", "agent_run", "agent_chat_status", "agent_chat_send", "agent_chat_reconnect", "agent_chat_stop", "agent_chat_new", "agents_list", "overview_files", "overview_agents", "overview_places", "agent_selected", "agent_open", "agent_save", "agent_reveal", "cluster_places", "cluster_contexts", "cluster_reload", "cluster_discover", "cluster_use", "send_preflight", "send_start", "send_status", "send_history", "send_stop"]
