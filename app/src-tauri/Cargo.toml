[package]
name = "orka-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "bridge_engine"

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
semver = "=1.0.28"
tokio = { version = "=1.54.1", features = ["process", "io-util", "sync", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
