[package]
name = "orka-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "bridge_engine"

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
libc = "=0.2.191"
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
semver = "=1.0.28"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "stream"] }
bridge-runtime-protocol = { path = "../../runtime/protocol" }
tokio = { version = "=1.54.1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_IO", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_System_Com"] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["time", "net"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
